# Automatic semantic versioning.
#
# Reads Conventional Commit subjects since the last tag, decides the bump,
# rewrites the version in pyproject.toml AND src/armsmith/__init__.py, commits,
# tags, and publishes a GitHub Release with generated notes.
#
#   fix: / perf:      -> patch   1.0.0 -> 1.0.1
#   feat:             -> minor   1.0.0 -> 1.1.0
#   BREAKING CHANGE:  -> major   1.0.0 -> 2.0.0
#   docs/chore/ci/... -> no release
#
# NO SECRETS ARE REQUIRED. The built-in GITHUB_TOKEN is enough; the repository's
# default workflow permission is `read`, so `contents: write` is granted at the
# job level below rather than by changing a repo-wide setting.

name: release

on:
  # Chained off ci rather than firing on push: a release must never be cut from
  # a red build. workflow_run only fires for workflows on the default branch.
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    # Skip when ci failed or was cancelled. Manual runs have no workflow_run
    # payload, so allow those through explicitly.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push the version commit + tag, create the Release
    concurrency:
      group: release
      cancel-in-progress: false   # never abort a half-published release

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          # Full history + tags: semantic-release derives the next version from
          # the commits since the last tag. A shallow clone silently yields the
          # wrong bump.
          fetch-depth: 0
          persist-credentials: true

      - name: Python Semantic Release
        id: semrel
        uses: python-semantic-release/python-semantic-release@v9
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep the floating v1 tag on the newest v1.x release
        # `uses: edycutjong/armsmith@v1` is the documented way to consume the
        # composite action, so v1 has to exist and has to track the latest 1.x.
        # Without this it is a dangling reference and the action fails to resolve.
        if: steps.semrel.outputs.released == 'true'
        run: |
          git tag -f v1
          git push -f origin v1

  # ── Publish to PyPI ───────────────────────────────────────────────────────
  # Trusted Publishing (OIDC) — no API token, no long-lived secret in the repo.
  # Gated on a repository variable so the job is inert until the PyPI-side
  # trusted publisher exists; a missing publisher would otherwise fail the run
  # and paint the release red for something that is purely account setup.
  #
  # To turn it on (once):
  #   1. pypi.org → Your projects → Publishing → add a pending publisher
  #        owner: edycutjong   repo: armsmith
  #        workflow: release.yml   environment: pypi
  #   2. gh variable set PUBLISH_TO_PYPI --body true -R edycutjong/armsmith
  publish-pypi:
    name: "Publish to PyPI"
    needs: [release]
    if: vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # required for Trusted Publishing
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
