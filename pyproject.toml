[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "armsmith"
version = "1.0.2"
description = "CLI agent that profiles AI repos on Arm, diagnoses aarch64 slowness with a 13-rule pack, and drafts PRs whose fixes passed a reproduce-benchmark gate."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Edy Cu" }]
keywords = ["arm", "aarch64", "graviton", "performance", "benchmark", "optimization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Benchmark",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "PyYAML>=6.0",
    "cryptography>=42.0",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
armsmith = "armsmith.cli:app"

[project.urls]
Homepage = "https://armsmith.edycu.dev"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The schema MUST be inside the package: data outside the package directory
# never reaches a wheel, and an installed armsmith that cannot load its own
# schema silently validates nothing.
armsmith = ["rules/packs/*.yaml", "schema/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# ── Lint ────────────────────────────────────────────────────────────────────
# Conservative rule set chosen to fit the EXISTING code, not to force a rewrite:
# pyflakes (F), a subset of pycodestyle (E/W), import order (I), pyupgrade (UP),
# and flake8-bugbear (B). Line length is advisory-off (E501) because several
# descriptor/citation strings are intentionally long; correctness rules stay on.
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]
# The four B-rules below are relaxed deliberately: fixing them would edit working,
# test-covered source for zero behavior change. Correctness rules (F/E/W/I/UP) stay on.
ignore = [
    "E501",   # long lines: rule descriptors + citation URLs are intentionally long
    "B008",   # Typer's `= typer.Option(...)` default-call is the framework's idiom
    "B904",   # `raise ... from` — exit codes are unchanged; chaining is cosmetic here
    "B905",   # `zip(strict=)` — call sites already pair equal-length sequences
    "B007",   # unused loop var in a tamper-test fixture; renaming changes nothing
    "UP042",  # `(str, Enum)` is deliberate: members serialize into signed canonical
              # JSON; switching to StrEnum could shift string output and break the
              # tamper-evident hash/recompute tests. Keep the explicit mixin.
]

# ── Types (advisory) ─────────────────────────────────────────────────────────
# mypy runs continue-on-error in CI: it is a signal, not a gate. Kept lenient so
# it never blocks a green suite while still surfacing real type drift in src/.
[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = false
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
disable_error_code = ["import-untyped"]

# ── Coverage (pytest-cov) ─────────────────────────────────────────────────────
# Line coverage over the installed package: 100% as of 2026-08-09. Re-measure and
# update the README whenever this moves — a stale figure is the one lie this
# project cannot afford. Branch coverage is
# intentionally OFF so the reported figure is the line-coverage number quoted in
# the README/deck. `exclude_lines` drops only standard defensive markers — it does
# NOT paper over anything: every statement is genuinely executed by a test that
# asserts behaviour. No `fail_under` gate: coverage is a signal here, like mypy.
[tool.coverage.run]
source = ["armsmith"]
branch = false

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

# ── Semantic release ──────────────────────────────────────────────────────────
# Version lives in exactly two places and both are rewritten automatically, so
# they can never drift: [project].version here, and __version__ in the package.
# Driven by Conventional Commit subjects, which this repo already uses.
#   fix: / perf:     -> patch      feat: -> minor      BREAKING CHANGE: -> major
#   docs/chore/ci/test/refactor/style/build -> no release at all
# Requires no secrets: the workflow grants the built-in GITHUB_TOKEN
# `contents: write` at job level. See .github/workflows/release.yml.
[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["src/armsmith/__init__.py:__version__"]
tag_format = "v{version}"
commit_message = "chore(release): v{version} [skip ci]"
# Build the sdist + wheel during the release so the artifacts exist for both the
# GitHub Release and the PyPI publish job (see .github/workflows/release.yml).
build_command = "python -m pip install build && python -m build"
# 1.0.0 is the deliberate starting point; never fall back to a 0.x line.
allow_zero_version = false
major_on_zero = false

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.commit_parser_options]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.semantic_release.publish]
upload_to_vcs_release = true
