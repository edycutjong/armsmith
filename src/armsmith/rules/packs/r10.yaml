# Armsmith rule descriptor — R10
id: R10
title: llama.cpp/ggml built without KleidiAI (GGML_CPU_KLEIDIAI=OFF)
kind: probe
requires: [cmake_cache]
summary: >
  The CMake cache of a ggml/llama.cpp build shows GGML_CPU_KLEIDIAI absent
  or OFF. KleidiAI microkernels use dotprod/i8mm/SVE/SME and are selected
  at runtime per detected CPU capability — leaving the flag off forfeits
  them (flag surface verified against the llama.cpp build docs).
fix_generator: >
  Rebuild with -DGGML_CPU_KLEIDIAI=ON (A/B both builds through the gate);
  on SME-capable hosts additionally sweep the GGML_KLEIDIAI_SME env var
  (unset / 0 / >0); on macOS pin --device none for any CPU claim because
  Metal outranks CPU.
expected_gain_range: [1.2, 2.0]
gain_note: >
  ESTIMATE — kernel-path dependent; the A/B build pair goes through the
  reproduce gate and only the measured delta is reported.
citation_url: https://github.com/ggml-org/llama.cpp/blob/master/docs/build.md
confidence: high
learning_path: https://learn.arm.com/learning-paths/servers-and-cloud-computing/llama-cpu/
snippet_lang: bash
before: |
  cmake -B build
after: |
  cmake -B build -DGGML_CPU_KLEIDIAI=ON
