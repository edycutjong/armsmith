# Armsmith rule descriptor — R13
id: R13
title: Serving overhead dominates kernel time (two-instrument divergence)
kind: probe
requires: [llama_bench, hyperfine]
summary: >
  llama-bench timings exclude tokenization and sampling (verified caveat in
  crawl/clean/sdk_llamacpp.md), so Armsmith runs BOTH instruments on the
  same workload: llama-bench for kernel-time tokens/sec and hyperfine for
  end-to-end wall time. When end-to-end exceeds kernel time by more than
  15%, the pipeline — not the kernels — is the bottleneck, and kernel
  tuning cannot deliver the expected wins.
fix_generator: >
  Diagnostic rule: quantifies the kernel vs pipeline split and redirects
  optimization to the serving layer (batched tokenization, prompt caching,
  streaming, server reuse instead of process-per-request). Both instruments'
  self-reported stats are cross-checked against their raw samples before
  the split is trusted.
expected_gain_range: [1.0, 1.0]
gain_note: >
  Diagnostic: no direct patch gain is claimed (range pinned to 1.0x); the
  value is redirected effort, quantified from two real instruments.
citation_url: https://github.com/ggml-org/llama.cpp/tree/master/tools/llama-bench
confidence: high
